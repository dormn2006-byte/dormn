name: Instant Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Instant Sync & Inject Secrets
        run: |
          # Stream the raw .env multi-line data text directly as a binary body string
          curl -X POST "https://b.dormn.com/api/v1/webhook/deploy" \
            -H "Content-Type: text/plain" \
            -H "X-Hub-Signature-256: ${{ secrets.WEBHOOK_SIGNATURE_HASH }}" \
            --data-binary "${{ secrets.LIVE_ENV_VARIABLES }}"
