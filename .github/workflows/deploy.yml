name: Instant Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Instant Sync & Inject Secrets
        run: |
          # Send the instant deployment alert using pure, escape-safe JSON
          curl -X POST "https://b.dormn.com/api/v1/webhook/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: ${{ secrets.WEBHOOK_SIGNATURE_HASH }}" \
            --data-raw "$(cat << 'EOF'
          {
            "secure_env_payload": "${{ secrets.LIVE_ENV_VARIABLES }}"
          }
          EOF
          )"
